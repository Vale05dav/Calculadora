<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .contenedor {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h2 {
            margin-bottom: 15px;
        }

        input {
            width: 80%;
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #007BFF;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .resultado {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>Prueba rápida</h2>
    <p>¿Cuánto es 2 + 2?</p>

    <input type="text" id="respuesta" placeholder="Escribe tu respuesta">

    <br>
    <button onclick="verificar()">Verificar</button>

    <div class="resultado" id="resultado"></div>
</div>

<script>
    function verificar() {
        let respuesta = document.getElementById("respuesta").value;
        let resultado = document.getElementById("resultado");

        if (respuesta == "4") {
            resultado.innerHTML = "Correcto ✅";
            resultado.style.color = "green";
        } else {
            resultado.innerHTML = "Incorrecto ❌";
            resultado.style.color = "red";
        }
    }
</script>

</body>
</html>
